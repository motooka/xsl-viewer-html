<!DOCTYPE html>
<html>
  <head>
    <title>XSL Viewer</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        min-height: 100%;
        min-width: 100%;
        margin: 0;
        padding: 16px;
      }
      @media print {
        .container {
          padding: 0;
        }
        .container > h1,
        .container > hr {
            display: none;
        }
      }

    </style>
    <script>
      /**
       * @param {arrayBuffer} ArrayBuffer
       * @returns {Promise<File[]>}
       */
      const decompressZip = async (arrayBuffer) => {
        async function decompressData(compressedData) {
          const reader = new Blob([compressedData])
            .stream()
            .pipeThrough(new DecompressionStream("deflate-raw"))
            .getReader();
          const chunks = [];
          let result = await reader.read();
          while (!result.done) {
            chunks.push(result.value);
            result = await reader.read();
          }
          return new Blob(chunks);
        }

        const dataView = new DataView(arrayBuffer);
        let offset = 0;
        const files = [];

        while (offset < dataView.byteLength) {
          const signature = dataView.getUint32(offset, true);
          if (signature !== 0x04034b50) break;
          const generalPurposeFlag = dataView.getUint16(offset + 6, true);
          const fileNameLength = dataView.getUint16(offset + 26, true);
          const extraFieldLength = dataView.getUint16(offset + 28, true);
          let compressedSize = dataView.getUint32(offset + 18, true);
          
          const isUtf8 = (generalPurposeFlag & 0x0800) !== 0;
          const decoder = new TextDecoder(isUtf8 ? "utf-8" : "shift-jis");
          const pathName = decoder.decode(
            arrayBuffer.slice(offset + 30, offset + 30 + fileNameLength)
          );

          offset += fileNameLength + extraFieldLength + 30;
          const dataOffset = offset;
          const isDataDescriptor = (generalPurposeFlag & 0x0008) !== 0;

          if (isDataDescriptor) {
            while (offset < dataView.byteLength) {
              const potentialSignature = dataView.getUint32(offset, true);
              if (potentialSignature === 0x08074b50) {
                compressedSize = dataView.getUint32(offset + 8, true);
                offset += 16;
                break;
              }
              offset++;
            }
          } else {
            offset += compressedSize;
          }

          if (pathName[pathName.length - 1] !== "/") {
            const decompressedData = await decompressData(
              arrayBuffer.slice(dataOffset, dataOffset + compressedSize)
            );
            const fileName = pathName.replace(/.*\//, "");
            files.push(new File([decompressedData], fileName));
          }
        }
        return files;
      };
      /**
       * @param {File[]} sourceFiles
       * @returns {Promise<File[]>}
       */
      const unzipFiles = async (sourceFiles) => {
        const unCompressPromises = sourceFiles.map(async (file) => {
          if (
            file.type.match(/^application\/(x-zip-compressed|zip)$/) ||
            file.name.match(/\.zip$/i)
          ) {
            return file.arrayBuffer().then(decompressZip);
          }
          return file;
        });
        return Promise.all(unCompressPromises).then((files) => {
          return files.flat();
        });
      };

      /**
       * @param {File[]} allFiles
       * @param {string} targetName
       * @returns {Promise<[string, string][]>}
       * */
      const convertXsl = async (allFiles, targetName = null) => {
        const documentFiles = Promise.all(
          allFiles
            .filter((file) => file.name.match(/\.xml$|\.xsl$/i))
            .map(async (file) => {
              const parser = new DOMParser();
              const xml = parser.parseFromString(
                await file.text(),
                "application/xml"
              );
              return [file.name, xml];
            })
        );
        return documentFiles.then((files) => {
          const fileMap = Object.fromEntries(files);
          let xmlDocs = files.filter(([name]) => name.match(/\.xml$/i));
          
          if (targetName) {
            xmlDocs = xmlDocs.filter(([name]) => name === targetName);
          }

          const documents = xmlDocs.map(([name, xmlDoc]) => {
            const xsltProcessor = new XSLTProcessor();
            const styleNodes = Array.from(xmlDoc.childNodes).filter(
              (node) =>
                node.nodeType === Node.PROCESSING_INSTRUCTION_NODE &&
                node.target === "xml-stylesheet"
            );
            styleNodes.forEach((styleNode) => {
              const hrefMatch = styleNode.data.match(/href="([^"]+)"/);
              if (hrefMatch) {
                const href = hrefMatch[1];
                const xslDoc = fileMap[href];
                if (xslDoc) xsltProcessor.importStylesheet(xslDoc);
              }
            });
            const resultDoc = xsltProcessor.transformToDocument(xmlDoc);
            const serializer = new XMLSerializer();
            const resultString = serializer.serializeToString(resultDoc);
            return [name, resultString];
          });
          return documents;
        });
      };

      const renderDocs = (docs, allFiles, shouldScroll = true) => {
        const body = document.body;
        docs.forEach(([name, doc]) => {
          const div = document.createElement("div");
          div.setAttribute("class", "container");
          const header = document.createElement("h1");
          header.innerText = name;
          const iframe = document.createElement("iframe");
          iframe.style.width = "100%";
          iframe.style.border = "none";
          iframe.scrolling = "no";
          div.append(header, iframe);
          body.append(div);
          const iframeDoc = iframe.contentWindow.document;
          iframeDoc.open();
          iframeDoc.write(doc);
          const style = iframeDoc.createElement("style");
          style.textContent = `
              html,body {
                margin: 0;
                padding: 0;
              }
              body {
                padding-right: 24px;
              }
              body > div {
                white-space: normal;
              }
              pre.oshirase {
                text-wrap-mode: wrap;
              }
              pre.normal {
                text-wrap: auto;
              }
            `;
          iframeDoc.head.appendChild(style);
          iframeDoc.close();

          const resize = () => {
            iframe.style.height =
              iframe.contentWindow.document.documentElement.scrollHeight + "px";
            iframe.style.width =
              iframe.contentWindow.document.documentElement.scrollWidth + "px";
          };
          iframe.onload = resize;
          resize();

          iframeDoc.addEventListener("click", (e) => {
            const a = e.target.closest("a");
            if (a && a.getAttribute("href")) {
              const href = a.getAttribute("href");
              if (href.match(/^(https?:|mailto:|tel:)/)) return;

              const decodedHref = decodeURIComponent(href);
              const targetFileName = decodedHref.replace(/.*\//, "");

              const existingHeader = Array.from(document.querySelectorAll("h1")).find(h1 => h1.innerText === targetFileName);
              if (existingHeader) {
                e.preventDefault();
                existingHeader.parentElement.scrollIntoView({ behavior: "smooth" });
                return;
              }

              const targetFile = allFiles.find((f) => f.name === targetFileName);
              if (targetFile) {
                e.preventDefault();
                if (targetFile.name.match(/\.xml$/i)) {
                  convertXsl(allFiles, targetFile.name).then((newDocs) => {
                    renderDocs(newDocs, allFiles);
                  });
                } else {
                  const url = URL.createObjectURL(targetFile);
                  const downloadLink = document.createElement("a");
                  downloadLink.href = url;
                  downloadLink.download = targetFile.name;
                  downloadLink.click();
                  setTimeout(() => URL.revokeObjectURL(url), 100);
                }
              }
            }
          });
          if (shouldScroll) {
            div.scrollIntoView({ behavior: "smooth" });
          }
        });
      };

      const handleDrop = (e) => {
        e.preventDefault();
        unzipFiles(Array.from(e.dataTransfer.files)).then((allFiles) => {
          convertXsl(allFiles).then((docs) => {
            document.body.innerHTML = "";
            renderDocs(docs, allFiles, false);
          });
        });
      };
    </script>
  </head>
  <body ondragover="event.preventDefault()" ondrop="handleDrop(event)">
    <div
      style="
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      "
    >
      <span
        style="
          padding: 16px;
          font-size: 2em;
          border: 2px dashed black;
          border-radius: 16px;
        "
      >
        Drop files or zip-file here
      </span>
    </div>
  </body>
</html>
